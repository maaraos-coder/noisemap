name: V3 build check

on:
  push:
    branches: [v3-react-maplibre, feature/facade-lden-chimbote-audit]
  pull_request:
    branches: [main, v3-react-maplibre]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall backend noise_app
      - run: python -m unittest backend/test_engine_regression.py
      - run: pip install pytest
      - run: python -m pytest -q backend/test_cnossos_road_five_categories.py backend/test_cnossos_full_emission.py backend/test_facade_lden_audit.py
