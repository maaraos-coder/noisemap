name: Road CNOSSOS regression (manual)
# The Python road-model tests are experimental and are not part of the
# production React/MapLibre build. Avoid email alerts on each main push while
# emission API and propagation tests await end-to-end verification.
# Run manually from Actions > Road CNOSSOS regression.
on:
  workflow_dispatch:

jobs:
  road-acoustics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_road_scenario.py tests/test_cnossos_education.py -q
      - run: python -m compileall -q app.py noise_app/
